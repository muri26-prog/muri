name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: TripScout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publishes the APK under a fixed "latest" release so it has a stable download link:
      # https://github.com/<owner>/<repo>/releases/download/latest/TripScout.apk
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TripScout.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TripScout.apk \
            --target "${{ github.sha }}" \
            --title "Trip Scout (latest build)" \
            --notes "Debug build from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Download TripScout.apk on your phone and open it to install."
